name: 기능 제안
description: 이용자·기여자 경험을 개선할 아이디어를 제안해 주세요.
title: "[Feature] "
labels:
  - enhancement
body:
  - type: textarea
    id: problem
    attributes:
      label: 해결하려는 문제
      description: 기능 이름보다 현재 어떤 점이 불편한지 먼저 설명해 주세요.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: 제안하는 해결 방법
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: 고려한 다른 방법
  - type: dropdown
    id: area
    attributes:
      label: 관련 영역
      options:
        - 플레이어 검색
        - 전투·누적 통계
        - 맵·팀·카운터
        - 스킨·번역
        - 모바일·접근성
        - 문서·기여 환경
        - 기타
    validations:
      required: true
  - type: checkboxes
    id: scope
    attributes:
      label: 데이터 영향
      options:
        - label: 통계의 의미나 표본 기준을 바꾸는 제안이면 그 영향을 본문에 적었습니다.
          required: false
